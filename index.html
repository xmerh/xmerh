<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F0B1F">
<title>Roleverse</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: #0F0B1F;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  #load {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 40%, #1B1436 0%, #0F0B1F 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    z-index: 10;
  }

  .brand {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 3px;
    margin-bottom: 32px;
    background: linear-gradient(90deg, #A78BFA, #F472B6, #60A5FA);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: .7; transform: scale(1); }
    50%      { opacity: 1;  transform: scale(1.05); }
  }

  .spinner {
    width: 54px;
    height: 54px;
    position: relative;
    margin-bottom: 28px;
  }
  .spinner::before,
  .spinner::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 3px solid transparent;
  }
  .spinner::before {
    border-top-color: #A78BFA;
    border-right-color: #F472B6;
    animation: spin 1s linear infinite;
  }
  .spinner::after {
    border-bottom-color: #60A5FA;
    border-left-color: #34D399;
    animation: spin 1.5s linear infinite reverse;
    inset: 6px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .dots {
    display: flex;
    gap: 6px;
  }
  .dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #A78BFA;
    opacity: .4;
    animation: bounce 1.2s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: .15s; background: #F472B6; }
  .dots span:nth-child(3) { animation-delay: .30s; background: #60A5FA; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: .4; }
    40%           { transform: translateY(-6px); opacity: 1; }
  }

  .label {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,.55);
    margin-top: 22px;
  }

  .error {
    color: #F87171;
    font-size: 14px;
    margin-top: 22px;
    text-align: center;
    padding: 0 24px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div id="load">
  <div class="brand">ROLEVERSE</div>
  <div class="spinner"></div>
  <div class="dots"><span></span><span></span><span></span></div>
  <div class="label">Loading</div>
</div>

<script>
  (function () {
    var loadEl = document.getElementById('load');

    // link.txt se URL fetch karo aur usi pe redirect kar do (WebView direct load karega)
    fetch('link.txt', { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('http ' + r.status);
        return r.text();
      })
      .then(function (u) {
        u = (u || '').replace(/[\u0000-\u001F\u007F]/g, '').trim();
        if (!u || !/^https?:\/\//i.test(u)) throw new Error('bad url');
        // Redirect — WebView is URL ko as main frame load karega
        window.location.replace(u);
      })
      .catch(function (e) {
        loadEl.innerHTML =
          '<div class="brand">ROLEVERSE</div>' +
          '<div class="error">Unable to load.<br>Please check your connection and try again.</div>';
      });
  })();
</script>
</body>
</html>
